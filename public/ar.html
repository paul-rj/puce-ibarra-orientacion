<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AR - PUCE Ibarra</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="ar.css" rel="stylesheet"/>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  </head>
  <body>

    <div id="status-panel">
      <div id="status-dot"></div>
      <span id="status-texto">Iniciando GPS...</span>
    </div>

    <button id="btn-volver" onclick="window.location.href='/'">← Volver</button>

    <div id="loading">
      <div class="loading-icono">📍</div>
      <div class="loading-titulo">Obteniendo ubicación</div>
      <div class="loading-subtitulo">Apunta la cámara hacia los edificios</div>
    </div>

    <div id="mira"></div>

    <div id="cartel-edificio">
      <div class="cartel-header">
        <span id="cartel-icono">🏛️</span>
        <div class="cartel-header-texto">
          <div id="cartel-nombre">—</div>
          <div id="cartel-tipo">—</div>
        </div>
        <div id="cartel-distancia">—</div>
      </div>
      <div id="cartel-descripcion">—</div>
    </div>

    <div id="instrucciones">
      📷 Apunta a un edificio o al QR de una puerta
    </div>

    <div id="qr-debug"></div>

    <div id="contador">
      <span class="num" id="num-edificios">0</span>
      edificios
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
      embedded
      style="width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;"
    >
      <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>
    </a-scene>

    <script src="ar-datos.js"></script>
    <script src="ar-cartel.js"></script>
    <script src="ar-escena.js"></script>
    <script src="ar-qr.js"></script>
  </body>
</html>
